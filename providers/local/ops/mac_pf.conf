# The Mac server's pf rules (MAC_RUNBOOK.md), loaded into the anchor com.apple/250.cbase-mac by
# mac_watchdog.sh, which keeps pf enabled and this anchor loaded. macOS's /etc/pf.conf passes everything,
# so these rules only take away: a source that opens SSH connections too fast is blocked for a day
# (the watchdog expires the table's entries after 86400 seconds). Screen Sharing answers only Tailscale (its
# IPv4 100.64.0.0/10 and IPv6 fd7a:115c:a1e0::/48), so the home network gets no login screen to guess at.
table <cbase_ssh_abuse> persist
block drop in quick proto tcp from <cbase_ssh_abuse> to any port 22
pass in proto tcp from any to any port 22 flags S/SA keep state (max-src-conn 10, max-src-conn-rate 5/60, overload <cbase_ssh_abuse> flush global)
block drop in quick inet proto tcp from ! 100.64.0.0/10 to any port 5900
block drop in quick inet6 proto tcp from ! fd7a:115c:a1e0::/48 to any port 5900
