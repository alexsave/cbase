AWSTemplateFormatVersion: "2010-09-09"
# The vm group __GROUP__, made by ./cbase group-init (tools/cbase.d/group.sh). Edits by hand are drift.
#if !ipv4
Description: "cbase vm group __GROUP__: the instance its apps run on, IPv6-only"
#end
#if ipv4
Description: "cbase vm group __GROUP__: the instance its apps run on, dual-stack"
#end

Parameters:
  InstanceType:
    Type: String
    Description: an arm64 (Graviton) instance type; cbase builds its servers for linux arm64
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: the Amazon Linux 2023 arm64 image the group was first made with (__AMIPARAM__)
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: the subnet's zone, one that offers the instance type (group-init picks it)
  CloudFrontPrefixList:
    Type: String
    Description: CloudFront's IPv6 origin-facing managed prefix list (__PREFIXLIST__) in this region
    AllowedPattern: "pl-[0-9a-f]+"
#if ipv4
  CloudFrontPrefixListIpv4:
    Type: String
    Description: CloudFront's IPv4 origin-facing managed prefix list (__PREFIXLISTIPV4__) in this region
    AllowedPattern: "pl-[0-9a-f]+"
#end
  ArtifactBucket:
    Type: String
    Description: the state bucket, whose artifacts/ the instance reads its apps' servers from

Resources:
  # The group's own network: a VPC with an Amazon-provided IPv6 /56 and one subnet, an internet
#if !ipv4
  # gateway and a ::/0 route. The subnet is IPv6-only: no IPv4 address and no NAT, as SSM, S3, IMDS and
  # CloudFront all speak IPv6 (vm_boot.sh points the SSM agent at their dual-stack endpoints).
#end
#if ipv4
  # gateway and a ::/0 route. The subnet is dual-stack (--ipv4), its IPv4 the Elastic IP's.
#end
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
#if !ipv4
      CidrBlock: 10.0.0.0/24   # EC2 requires one; no subnet uses it
#end
#if ipv4
      CidrBlock: 10.0.0.0/24   # EC2 requires one; the subnet's
#end
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: cbase-vm-__GROUP__
  VpcIpv6:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref Vpc
      AmazonProvidedIpv6CidrBlock: true
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: cbase-vm-__GROUP__
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw
  Subnet:
    Type: AWS::EC2::Subnet
    DependsOn: VpcIpv6
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
#if !ipv4
      Ipv6Native: true
      EnableDns64: false
#end
#if ipv4
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: false   # the Elastic IP is its public IPv4
#end
      Ipv6CidrBlock: !Select [0, !Cidr [!Select [0, !GetAtt Vpc.Ipv6CidrBlocks], 1, 64]]
      AssignIpv6AddressOnCreation: true
      PrivateDnsNameOptionsOnLaunch:
        HostnameType: resource-name
        EnableResourceNameDnsAAAARecord: true
      Tags:
        - Key: Name
          Value: cbase-vm-__GROUP__
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: cbase-vm-__GROUP__
  DefaultRoute6:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationIpv6CidrBlock: ::/0
#if ipv4
      GatewayId: !Ref Igw
  DefaultRoute4:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
#end
      GatewayId: !Ref Igw
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  Role:
    Type: AWS::IAM::Role
    Properties:
      Description: cbase vm group __GROUP__'s instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: cbase-apps
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TheAppsServers
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/artifacts/*"
              # The apps' backups (serve's CBASE_BACKUP_*): s3://<state bucket>/backups/, and no
              # other key of the bucket. One role serves every app of the group, and any process on
              # the instance can read its credentials from IMDS, so a per-app prefix in IAM would
              # not hold one app from another: the boundary between apps is their Unix users.
              - Sid: TheAppsBackups
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/backups/*"
              - Sid: TheAppsBackupsList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}"
                Condition:
                  StringLike:
                    s3:prefix: "backups/*"
              - Sid: TheAppsSettings
                Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cbase/*"
              # The boot's claim of the fixed address (vm_boot.sh), on an interface of this subnet alone.
              - Sid: TheFixedAddress
                Effect: Allow
                Action: ec2:AssignIpv6Addresses
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                Condition:
                  ArnEquals:
                    ec2:Subnet: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${Subnet}"

  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cbase vm group __GROUP__ - the app ports 8700-8799 from CloudFront (IPv6) alone
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8700
          ToPort: 8799
          SourcePrefixListId: !Ref CloudFrontPrefixList
          Description: CloudFront IPv6 origin-facing addresses to the app ports
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIpv6: ::/0
          Description: all egress (IPv6)
#if ipv4
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: all egress (IPv4)
  SecurityGroupIpv4:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: cbase vm group __GROUP__ - the app ports 8700-8799 from CloudFront (IPv4) alone
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8700
          ToPort: 8799
          SourcePrefixListId: !Ref CloudFrontPrefixListIpv4
          Description: CloudFront IPv4 origin-facing addresses to the app ports
#end

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpProtocolIpv6: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  Instance:
    Type: AWS::EC2::Instance
#if !ipv4
    DependsOn: [DefaultRoute6, SubnetRoutes]
#end
#if ipv4
    DependsOn: [DefaultRoute6, DefaultRoute4, SubnetRoutes]
#end
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref Subnet
#if !ipv4
          GroupSet: [!GetAtt SecurityGroup.GroupId]
#end
#if ipv4
          GroupSet: [!GetAtt SecurityGroup.GroupId, !GetAtt SecurityGroupIpv4.GroupId]
#end
          # A random address of the subnet: the boot claims the fixed one (OriginIpv6) itself.
          Ipv6AddressCount: 1
          AssociatePublicIpAddress: false
          DeleteOnTermination: true
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      UserData:
        Fn::Base64: !Sub
          - |
__BOOT__
          - OriginIpv6: !Select [0, !Split ["/", !Select [1, !Cidr [!Select [0, !GetAtt Subnet.Ipv6CidrBlocks], 2, 4]]]]
      Tags:
        - Key: cbase:vm-group
          Value: __GROUP__
        - Key: Name
          Value: cbase-vm-__GROUP__

#if ipv4
  Address:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance

#end
Outputs:
  InstanceId:
    Value: !Ref Instance
  OriginIpv6:
    Description: the fixed IPv6 address the instance claims at boot, the subnet's ::10 (its AAAA record's)
    Value: !Select [0, !Split ["/", !Select [1, !Cidr [!Select [0, !GetAtt Subnet.Ipv6CidrBlocks], 2, 4]]]]
