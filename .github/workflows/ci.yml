# cbase's own CI: the platform built and tested with its example app on Linux and macOS, the example
# again as a local-only consumer (part of make check, with its link check), sanitized on Linux, the
# client's wasm half with the pinned toolchain, the client's platform hosts, every fuzz target, the coverage gate, the store on
# DynamoDB Local, and the deploy tooling's own tests. Nothing here deploys: a product deploys its own
# build of cbase from its own repository.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}

# Pull request runs are cancelled by newer pushes to the same pull request; main's run every time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A release tag names the release VERSION holds (core/test/unit_version.c holds CB_VERSION to the
  # same file): pushing v0.2.0 with VERSION still at 0.1.9 fails here.
  version:
    name: the tag is v<VERSION>
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(cat VERSION)"
          if [ "$TAG" != "$want" ]; then echo "tag $TAG, but VERSION says $want" >&2; exit 1; fi
          echo "tag $TAG is VERSION"

  # Linux: the platform the shipped binaries run on.
  check:
    name: make check (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: unit tests, smokes, the client, the repository gate, the symbol gate, the local-only example offline and stripped of aws and ops, its check
        run: make -j"$(getconf _NPROCESSORS_ONLN)" check
      # CBASE_IO_URING (net/loop.h): the suite again with every loop on io_uring; unit_uring's first
      # line says whether the runner allowed it (else the loops fall back to epoll, as serve's would).
      - name: unit tests and smokes with every loop on io_uring
        run: make -j"$(getconf _NPROCESSORS_ONLN)" test-uring
      - name: the compile rules' own test
        run: bash tools/c_rules_test.sh
      - name: fuzz.mk's bookkeeping
        run: bash fuzz/test/fuzz_mk_test.sh

  # macOS: the same suite on the development platform, linked against Homebrew's SQLite (upstream's,
  # as on Linux and in production; Apple's system one has its own page cache, cbase.mk).
  check_macos:
    name: make check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew list openssl@3 sqlite >/dev/null 2>&1 || brew install openssl@3 sqlite
      - name: build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: unit tests, smokes, the client, the repository gate, the symbol gate, the local-only example offline and stripped of aws and ops, its check
        run: make -j"$(getconf _NPROCESSORS_ONLN)" check

  asan:
    name: make check-asan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      # The unit tests and smokes, and every checked-in fuzz input (each target's
      # <side>/fuzz/corpus, the reproducers of every bug the fuzzers found among them) through its
      # target once (fuzz-replay), all under the same sanitizers, with gcc and no libFuzzer.
      - name: unit tests, smokes and the fuzz corpus under ASan + UBSan
        run: make -j"$(getconf _NPROCESSORS_ONLN)" check-asan

  # THE CLIENT's wasm half (client/, docs/CLIENT_DESIGN.md): the module built with the pinned clang,
  # held to its size budget, its TypeScript generated by structgen, and the page shim's tests run
  # against it on node alone. (Its C tests run in `check` above.)
  client:
    name: client wasm, size gate and shim tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # tools/ci_llvm.sh's pinned downloads (binaryen's release tarball, llvm.sh), so a run does not
      # need github.com's release host once one has filled it. ci_llvm.sh owns the cache: it hashes
      # every entry against its pin before use, and the pins live in it, hence the key.
      - name: Toolchain download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-llvm-cache
          key: ci-llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci_llvm.sh') }}
      - name: Toolchain (the pinned clang and libclang)
        run: bash tools/ci_llvm.sh
      # structgen and tools/sgcommon on their own (a project can take them alone): built and tested
      # with nothing else of the repository.
      - name: structgen's own tests
        run: make -C tools/structgen test
      - name: the module and its size gate
        run: make -C client wasm
      - name: the page shim's tests over the module
        run: make -C client ts-test

  # THE CLIENT's platform hosts (client/hosts/<name>/host.mk, each one's README.md): every host whose
  # test needs its platform's headers, fetched by a pinned commit into client/build. Each runs the
  # shared host suite on its host (every case with socket ids from 1 and from 0), natively and under
  # ASan + UBSan, then compiles the host for wasm32 with the pinned clang, libc-gates and links it.
  # A host's own check may build and run a whole app on it (the server too, so the server's libraries).
  client_hosts:
    name: client hosts on their platforms (host suite, wasm32, libc gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      # tools/ci_llvm.sh's pinned downloads (binaryen's release tarball, llvm.sh), so a run does not
      # need github.com's release host once one has filled it. ci_llvm.sh owns the cache: it hashes
      # every entry against its pin before use, and the pins live in it, hence the key.
      - name: Toolchain download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-llvm-cache
          key: ci-llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci_llvm.sh') }}
      - name: Toolchain (the pinned clang and libclang)
        run: bash tools/ci_llvm.sh
      # example/minimal/e2e.mjs opens the minimal app's page in the runner's Google Chrome through
      # its UI framework's DevTools client, which needs Node 22 or later; MINIMAL_E2E=1 makes a missing
      # one a failure, not a skip. --no-sandbox: the runner's AppArmor may refuse Chrome's sandbox.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: every platform host's suite, its wasm32 compile, libc gate and link
        env:
          MINIMAL_E2E: 1
          CHROME_ARGS: --no-sandbox
        run: make -C client -j"$(getconf _NPROCESSORS_ONLN)" check-hosts

  # THE FUZZ STAGE: one job per target, in parallel, each 30 s from its corpus (fuzz_nightly.yml is
  # the same shape at 10 min): every target of cbase's own build (<t>) and the client's
  # (client:<t>).
  fuzz_targets:
    name: fuzz targets to run
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          t="$(make -s print-fuzz-targets) client:client"
          echo "targets=$(tr ' ' '\n' <<< "$t" | sed '/^$/d' | jq -R . | jq -sc .)" | tee -a "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz-smoke ${{ matrix.target }} (30 s)
    needs: fuzz_targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz_targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential clang libssl-dev libsqlite3-dev
      # The name's prefix says the build: its directory, its binary, its smoke goal and where a
      # crash lands.
      - id: where
        env:
          T: ${{ matrix.target }}
        run: |
          case "$T" in
            client:*) t=${T#client:}
                      echo "dir=client"; echo "bin=build/fuzz/$t"
                      echo "smoke=fuzz-smoke FUZZ_TIME=30"; echo "crashes=client/build/fuzz-crashes" ;;
            *:*)      echo "fuzz target $T: no build has that prefix" >&2; exit 1 ;;
            *)        echo "dir=."; echo "bin=build/fuzz/$T"
                      echo "smoke=fuzz-smoke FUZZ_TIME=30 FUZZ_TARGETS=$T"; echo "crashes=build/fuzz-crashes/$T" ;;
          esac >> "$GITHUB_OUTPUT"
          echo "artifact=fuzz-crashes-${T/:/-}" >> "$GITHUB_OUTPUT"
      - name: build
        run: make -C ${{ steps.where.outputs.dir }} -j"$(getconf _NPROCESSORS_ONLN)" ${{ steps.where.outputs.bin }}
      - name: 30 s from its corpus
        run: make -C ${{ steps.where.outputs.dir }} ${{ steps.where.outputs.smoke }}
      - name: the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.where.outputs.artifact }}
          path: ${{ steps.where.outputs.crashes }}
          if-no-files-found: ignore
          retention-days: 30

  # docs/COVERAGE.md: line and branch floors, and no function that no test calls (tools/cov_floor.txt
  # names the ones allowed, with a reason).
  coverage:
    name: make coverage (floors, no function at zero)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      - name: gcovr
        run: pipx install gcovr==8.6 || pip install --break-system-packages gcovr==8.6
      - name: the coverage build, every test, the gate
        run: make -j"$(nproc)" coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cbase-coverage
          path: |
            build/cov/report.txt
            build/cov/coverage.lcov
          if-no-files-found: ignore
          retention-days: 14

  dynamo:
    name: make check-dynamo (DynamoDB Local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential libssl-dev libsqlite3-dev
      # The runner image has Docker and the AWS CLI; dynamo_local.sh starts amazon/dynamodb-local
      # (pinned by digest) and makes the table from providers/aws/ops/cbase.yaml.
      - name: DynamoDB Local
        run: providers/aws/ops/dynamo_local.sh > /dev/null
      - name: the store conformance suite and the example's smoke, on DynamoDB
        run: make -j"$(getconf _NPROCESSORS_ONLN)" check-dynamo
      - name: stop DynamoDB Local
        if: always()
        run: providers/aws/ops/dynamo_local.sh --stop

  ops:
    name: templates and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: the CloudFormation templates (cfn-lint, no AWS calls)
        run: |
          python3 -m venv /tmp/cfn
          /tmp/cfn/bin/pip install -q cfn-lint==1.57.2
          /tmp/cfn/bin/cfn-lint --regions us-east-1 -- providers/aws/ops/cbase.yaml providers/local/ops/vm.yaml
          # The app stack ./cbase deploy renders, for a static site, one with a domain, and a full app
          # with every kind of route (tools/cbase template: no AWS).
          mkdir -p /tmp/apps
          printf 'CBASE_APP = site\nCBASE_VM = none\n' > /tmp/apps/site.conf
          printf 'CBASE_APP = www\nCBASE_VM = none\nCBASE_DOMAIN = www.example.com\n' > /tmp/apps/www.conf
          printf 'CBASE_APP = shop\nCBASE_DOMAIN = shop.example.com\nCBASE_API_HOST = api.example.com\nCBASE_ROUTE = /api/* vm\nCBASE_ROUTE = /live ws\nCBASE_ROUTE = /img/* static nocache GET,OPTIONS\nCBASE_ROUTE = /read vm cache GET\n' > /tmp/apps/shop.conf
          for a in site www shop; do tools/cbase -f /tmp/apps/$a.conf template > /tmp/apps/$a.yaml; done
          /tmp/cfn/bin/cfn-lint --regions us-east-1 -- /tmp/apps/site.yaml /tmp/apps/www.yaml /tmp/apps/shop.yaml
          # The group stacks group-init makes (tools/cbase group-template: no AWS).
          tools/cbase group-template vm shop > /tmp/apps/group-vm.yaml
          tools/cbase group-template vm shop --ipv4 > /tmp/apps/group-vm-ipv4.yaml
          tools/cbase group-template static shop > /tmp/apps/group-static.yaml
          /tmp/cfn/bin/cfn-lint --regions us-east-1 -- /tmp/apps/group-vm.yaml /tmp/apps/group-vm-ipv4.yaml /tmp/apps/group-static.yaml
      - name: the shell scripts
        run: |
          s="$(git ls-files 'ops/*.sh' 'providers/*/ops/*.sh' 'providers/*/ops/test/*.sh' 'fuzz/test/*.sh' tools/repo_gate_test.sh tools/c_rules_test.sh tools/changed_files.sh tools/changed_files_test.sh tools/libc_gate.sh tools/symbol_gate.sh tools/offline_build_test.sh tools/serve.sh tools/serve_test.sh tools/new.sh tools/new_test.sh tools/cbase 'tools/cbase.d/*.sh' 'tools/cbase.d/test/*.sh' client/test/requires_gate.sh 'client/hosts/*/*.sh' example/minimal/check.sh)"
          # shellcheck disable=SC2086
          bash -n $s
          # shellcheck disable=SC2086
          shellcheck -x $s
      - name: the deploy tooling's tests (no AWS calls)
        run: make ops-test
